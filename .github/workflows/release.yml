# Bumps the version in granola_autostart/__init__.py, commits it to main, and tags it. The tag starts the Build
# workflow, which tests, builds the installer, and attaches it to a GitHub release.
# Run it from the Actions tab (or `gh workflow run release.yml -f bump=minor`). The Dependabot workflow also runs it, with
# a patch bump, once Dependabot's Python updates have merged. Ubuntu, because nothing here needs Windows.
# It pushes with the RELEASE_DEPLOY_KEY secret, a write deploy key: the ruleset on main lets deploy keys past its
# pull-request rule, which the workflow's own token can't be exempted from, and their pushes start other workflows,
# which the token's pushes don't. A retry whose tag already exists pushes nothing, so it dispatches Build itself.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase. none re-releases the current version without a bump, for retrying a failed build
        type: choice
        options: [minor, patch, major, none]
        default: minor

permissions:
  contents: read # pushes use the deploy key
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Bump, commit, and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          file=granola_autostart/__init__.py
          current=$(sed -n 's/^__version__ = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' "$file")
          [ -n "$current" ] || { echo "::error::no X.Y.Z __version__ in $file"; exit 1; }
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            none) ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          tag_exists=false
          git ls-remote --exit-code --tags origin "refs/tags/v$new" > /dev/null && tag_exists=true
          pushed=true
          if [ "$BUMP" = none ]; then
            # Retry the current version: reuse its tag, or create it on this commit if the bump never got that far.
            if [ "$tag_exists" = false ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "v$new"
              git push origin "v$new"
            else
              pushed=false
            fi
          else
            [ "$tag_exists" = false ] || { echo "::error::tag v$new already exists"; exit 1; }
            sed -i "s/^__version__ = \".*\"$/__version__ = \"$new\"/" "$file"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Bump the version to $new."
            git tag "v$new"
            git push --atomic origin HEAD:main "v$new"
          fi
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
      - name: Build and release the existing tag
        if: steps.bump.outputs.pushed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.bump.outputs.tag }}"
