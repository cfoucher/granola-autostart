# Tests, then an installer, for pushes to main, version tags, pull requests, and manual runs.
# Windows runners, because the tests and the build use winreg and ctypes.windll. The repo is private, so
# runner time comes out of GitHub Free's monthly allowance, where Windows minutes count double: one Windows
# job per run, cancelled when superseded, and none for changes to Markdown files alone.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - run: python -m pip install -r requirements-build.txt -c constraints.txt
      - run: python -m pytest -q
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (python -c "from granola_autostart import __version__; print(__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match granola_autostart/__init__.py ($version)" }
      - run: choco install innosetup --no-progress -y
      - run: ./build.ps1 -SkipTests
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: GranolaAutostart-setup
          path: dist/GranolaAutostart-*-setup.exe
          retention-days: 7
          if-no-files-found: error

  release:
    # A version tag keeps its installer on a GitHub release. Linux is enough to upload a file, and cheaper.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: GranolaAutostart-setup
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/GranolaAutostart-*-setup.exe \
            --repo "$GITHUB_REPOSITORY" --title "Granola Autostart ${GITHUB_REF_NAME#v}" --generate-notes
